<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Visitas PJ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mu:#667085;--bd:#d9dee5;--ac:#0b5fff;--ac2:#e8f0ff;--rd:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--tx:#eef1f5;--mu:#98a2b3;--bd:#2d3643;--ac:#5b92ff;--ac2:#1f2b45;--rd:#ff7b72}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--tx:#eef1f5;--mu:#98a2b3;--bd:#2d3643;--ac:#5b92ff;--ac2:#1f2b45;--rd:#ff7b72}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0 0 12px}h2{font-size:1rem;margin:20px 0 8px;color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
label{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px}
textarea{min-height:80px}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.sec{background:var(--ac2);color:var(--ac)}button.del{background:transparent;color:var(--rd)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
.bar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.bar input{flex:1;min-width:150px}
.it{cursor:pointer}.it b{display:block}.it small{color:var(--mu)}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:99px;padding:2px 10px;font-size:.75rem;margin:4px 4px 0 0}
.hide{display:none}.msg{color:var(--mu);text-align:center;padding:20px}
.dl{margin:6px 0}.dl span{color:var(--mu);font-size:.85rem;display:block}
</style></head><body><main>
<div id="list">
<h1>📋 Visitas — Clientes PJ</h1>
<div class="bar"><input id="q" placeholder="Buscar por nome ou CNPJ"><button id="new">+ Nova visita</button></div>
<div id="items"><div class="msg">Carregando…</div></div>
</div>

<div id="form" class="hide">
<h1 id="ft">Nova visita</h1>
<div class="card">
<h2>Empresa</h2>
<label>Data da visita</label><input type="date" id="data">
<label>Nome da empresa</label><input id="nome">
<label>CNPJ</label><input id="cnpj" inputmode="numeric" placeholder="00.000.000/0000-00" maxlength="18">
<label>Pessoa de contato</label><input id="contato">
<label>Segmento</label><input id="segmento">
<label>Como a empresa começou (breve resumo)</label><textarea id="historia"></textarea>
<h2>Sócios (até 5)</h2>
<div id="socios"></div>
<button class="sec" id="addSocio" type="button">+ Adicionar sócio</button>
<h2>Financeiro</h2>
<label>Faturamento (R$)</label><input id="fat" placeholder="Ex.: 150.000 / mês">
<label>Recebimentos</label>
<select id="rec"><option value="">Selecione</option><option>Boleto</option><option>Adquirência (cartão)</option><option>Boleto e adquirência</option><option>Outros</option></select>
<label>Pagamentos por boleto — quantidade</label><input id="pagBol" type="number" min="0" inputmode="numeric">
<label>Investimentos</label><textarea id="inv"></textarea>
<h2>Capital de giro</h2>
<label>Interesse em capital de giro?</label>
<select id="cg"><option value="">Selecione</option><option>Sim</option><option>Não</option><option>Talvez / avaliar</option></select>
<label>Qual garantia disponível?</label><input id="gar" placeholder="Ex.: recebíveis, imóvel, aval, veículo">
<label>Observações</label><textarea id="obs"></textarea>
</div>
<div class="bar"><button id="save">Salvar</button><button class="sec" id="cancel">Voltar</button><button class="del" id="rm">Excluir</button></div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const F=['data','nome','cnpj','contato','segmento','historia','fat','rec','pagBol','inv','cg','gar','obs'];
let col=null,rows=[],cur=null,mem=false;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* storage: db (private per user) with localStorage fallback */
function lsLoad(){try{return JSON.parse(localStorage.getItem('visitas')||'[]')}catch(e){return[]}}
function lsSave(){try{localStorage.setItem('visitas',JSON.stringify(rows))}catch(e){}}
async function init(){
  let timer=setTimeout(fallback,10000);
  try{
    const db=await claude.use('db'),user=await claude.use('user');
    if(!db||!user){clearTimeout(timer);return fallback()}
    const id=await user.id();
    col=db.collection('data/users/'+id+'/visitas');
    col.onSnapshot(s=>{clearTimeout(timer);rows=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{clearTimeout(timer);fallback()});
  }catch(e){clearTimeout(timer);fallback()}
}
function fallback(){if(col)return;mem=true;rows=lsLoad();render()}
function render(){
  const q=$('q').value.toLowerCase().replace(/[.\-\/]/g,'');
  const l=rows.filter(r=>!q||((r.nome||'')+(r.cnpj||'')).toLowerCase().replace(/[.\-\/]/g,'').includes(q))
    .sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  $('items').innerHTML=(mem?'<div class="msg">Modo local: dados salvos só neste navegador.</div>':'')+
   (l.length?l.map(r=>`<div class="card it" data-id="${esc(r.id)}"><b>${esc(r.nome)||'(sem nome)'}</b><small>${esc(r.cnpj)} · ${esc(r.contato)} · ${r.data?r.data.split('-').reverse().join('/'):''}</small><div>${r.segmento?`<span class="tag">${esc(r.segmento)}</span>`:''}${r.cg==='Sim'?'<span class="tag">Capital de giro: Sim</span>':''}</div></div>`).join(''):'<div class="msg">Nenhuma visita registrada ainda.</div>');
}
function socioRow(v=''){
  const d=document.createElement('div');d.className='row dl';
  d.innerHTML='<input class="s" placeholder="Nome do sócio"><button class="del" type="button">✕</button>';
  d.querySelector('input').value=v;
  d.querySelector('button').onclick=()=>{d.remove();chk()};
  $('socios').appendChild(d);chk();
}
function chk(){$('addSocio').classList.toggle('hide',$('socios').children.length>=5)}
function open(r){
  cur=r||null;$('ft').textContent=r?'Editar visita':'Nova visita';
  F.forEach(k=>$(k).value=r?.[k]??'');
  if(!r)$('data').value=new Date().toISOString().slice(0,10);
  $('socios').innerHTML='';
  (r?.socios?.length?r.socios:['']).forEach(s=>socioRow(s));
  $('rm').classList.toggle('hide',!r);
  $('list').classList.add('hide');$('form').classList.remove('hide');scrollTo(0,0);
}
function back(){$('form').classList.add('hide');$('list').classList.remove('hide')}
$('new').onclick=()=>open();
$('cancel').onclick=back;
$('q').oninput=render;
$('addSocio').onclick=()=>{if($('socios').children.length<5)socioRow()};
$('items').onclick=e=>{const c=e.target.closest('.it');if(c)open(rows.find(r=>r.id===c.dataset.id))};
$('cnpj').oninput=e=>{let v=e.target.value.replace(/\D/g,'').slice(0,14);
  v=v.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2');e.target.value=v};
$('save').onclick=async()=>{
  if(!$('nome').value.trim()){alert('Informe o nome da empresa.');return}
  const o={};F.forEach(k=>o[k]=$(k).value);
  o.socios=[...document.querySelectorAll('.s')].map(i=>i.value.trim()).filter(Boolean);
  const id=cur?.id||('v'+Date.now());o.atualizado=Date.now();
  try{
    if(mem){const i=rows.findIndex(r=>r.id===id);const n={id,...o};i>=0?rows[i]=n:rows.push(n);lsSave();render()}
    else await col.doc(id).set(o);
    back();
  }catch(e){alert('Não foi possível salvar. Tente novamente.')}
};
$('rm').onclick=async()=>{
  if(!cur||!confirm('Excluir esta visita?'))return;
  try{if(mem){rows=rows.filter(r=>r.id!==cur.id);lsSave();render()}else await col.doc(cur.id).delete();back()}
  catch(e){alert('Não foi possível excluir.')}
};
render();init();
</script></body></html>
