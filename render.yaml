services:
  - type: web
    name: visitas-pj
    runtime: static
    buildCommand: echo "sem build"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
